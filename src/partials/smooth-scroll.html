<!-- Smooth scrolling (Lenis), photo lean on fast scroll, and the 2px progress bar.
     Off for prefers-reduced-motion: native scrolling, no lean (the progress bar still tracks the page). -->
<script type="module">
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const bar = document.querySelector('[data-scroll-progress]');
const photos = Array.from(document.querySelectorAll('[data-lean]'));
const nav = document.querySelector('[data-nav]');
const nativeProgress = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
};
const setBar = (p) => { if (bar) bar.style.transform = `scaleX(${p.toFixed(4)})`; };

if (reduce) {
  addEventListener('scroll', () => setBar(nativeProgress()), { passive: true });
  setBar(nativeProgress());
} else {
  let lenis = null;
  try {
    const { default: Lenis } = await import('https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.mjs');
    // lerp 0.085 + wheelMultiplier 0.9: the wheel glides with a little weight. Touch stays native (Lenis default).
    lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, autoRaf: false });
    window.jhLenis = lenis;
  } catch (e) { lenis = null; }                                       // CDN blocked: plain native scrolling still works

  // Same-page anchor links (#faq, /#how-it-works on the homepage) glide to their section, clear of the sticky nav.
  if (lenis) document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href*="#"]');
    if (!a || a.pathname !== location.pathname || !a.hash) return;
    const target = document.querySelector(a.hash);
    if (!target) return;
    e.preventDefault();
    lenis.scrollTo(target, { offset: -((nav ? nav.offsetHeight : 0) + 16), duration: 1.2 });
    history.pushState(null, '', a.hash);
  });

  // One loop drives Lenis, the photo lean and the progress bar. Paused while the tab is hidden.
  let raf = 0, skew = 0, lastWritten = null;
  const frame = (time) => {
    raf = requestAnimationFrame(frame);
    if (lenis) lenis.raf(time);
    const v = lenis ? Math.max(-7, Math.min(7, lenis.velocity || 0)) : 0;
    skew += (v * 0.35 - skew) * 0.12;                                // ease toward the scroll speed
    if (Math.abs(skew) < 0.002) skew = 0;
    const t = skew === 0 ? '' : `skewY(${skew.toFixed(3)}deg) scale(${(1 - Math.abs(skew) * 0.006).toFixed(4)})`;
    if (t !== lastWritten) {                                          // only touch the DOM when it changes
      photos.forEach((p) => { p.style.transform = t; });
      lastWritten = t;
    }
    setBar(lenis ? lenis.progress || 0 : nativeProgress());
  };
  const start = () => { if (!raf) raf = requestAnimationFrame(frame); };
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
  addEventListener('pagehide', (e) => { if (e.persisted) return; stop(); if (lenis) { lenis.destroy(); lenis = null; window.jhLenis = null; } });
  start();
}
</script>
